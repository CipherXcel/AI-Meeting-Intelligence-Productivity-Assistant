services:
  postgres:
    image: postgres:16
    container_name: meetagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic_calendar_app_db
    ports:
      - "5443:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: ai-meeting-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  postgres_data: