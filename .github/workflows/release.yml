name: Build and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://cipherxcel.dev
      - name: Package release
        run: |
          printf '%s\n' "$GITHUB_SHA" > frontend/out/release.txt
          tar -czf release.tgz package.json package-lock.json backend/package.json backend/dist frontend/package.json frontend/out scripts/prepare-pageflip.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tgz
          retention-days: 7
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.EC2_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
      - name: Deploy checked release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$EC2_SSH_KEY" && test -n "$EC2_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${opts[@]}" release.tgz "$EC2_USER@$EC2_HOST:/tmp/agentbuddy-$GITHUB_SHA.tgz"
          ssh "${opts[@]}" "$EC2_USER@$EC2_HOST" "bash -s -- $GITHUB_SHA" < scripts/deploy-ec2.sh
